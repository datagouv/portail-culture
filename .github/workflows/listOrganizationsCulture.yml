name: Update Culture Organizations List

on:
  workflow_dispatch: # Lancement manuel
  schedule:
    - cron: "0 3 * * 1" # Tous les lundis à 3h du matin

jobs:
  update-culture-orgs-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Documentation branch
        uses: actions/checkout@v4
        with:
          repository: datagouv/portail-culture   # 👈 Assure qu’on clone ton dépôt
          ref: Documentation                    # 👈 Clone explicitement la branche Documentation
          fetch-depth: 0

      - name: Check files (debug)
        run: |
          echo "📁 Current working directory: $(pwd)"
          ls -R | head -n 100

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install datagouv-client

      - name: Run Culture Organizations script
        run: |
          python Documentation/data/script/selectOrganizationsTag.py
        env:
          TAG: culture
          OUTPUT_PATH: Documentation/data/organizations-datasets.json

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Add generated JSON
        run: |
          git add Documentation/data/organizations-datasets.json || echo "no JSON found"

      - name: Commit changes
        run: |
          git commit -m "Auto-update organizations list (culture) [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push origin Documentation
