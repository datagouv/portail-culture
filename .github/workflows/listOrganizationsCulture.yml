name: 🏛️ Génération de la liste des organisations (tag "culture")

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  update-organizations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (branch Documentation)
        uses: actions/checkout@v4
        with:
          ref: Documentation
          fetch-depth: 0

      - name: Debug repository structure
        run: |
          echo "📂 Current directory: $(pwd)"
          echo "📁 Repository contents:"
          ls -R .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datagouv-client

      - name: Generate organizations JSON
        run: python3 Documentation/data/script/selectOrganizationsTag.py
        env:
          TAG: culture
          OUTPUT_PATH: configs/culture/organizations-datasets.json

      - name: Commit and push changes
        run: |
          git config user.name "data.gouv.fr Bot"
          git config user.email "bot@data.gouv.fr"
          git add configs/culture/organizations-datasets.json
          git diff --cached --quiet || git commit -m "🤖 Mise à jour auto des organisations (culture)"
          git push
