jobs:
  update-organizations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Documentation

      - name: Debug repository structure
        run: |
          echo "📂 Current directory: $(pwd)"
          echo "📁 Listing contents:"
          ls -R .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datagouv-client

      - name: Generate organizations JSON
        run: python3 Documentation/data/script/selectOrganizationsTag.py
        env:
          TAG: culture
          OUTPUT_PATH: configs/culture/organizations-datasets.json

      - name: Commit and push changes
        run: |
          git config user.name "data.gouv.fr Bot"
          git config user.email "bot@data.gouv.fr"
          git add configs/culture/organizations-datasets.json
          git diff --cached --quiet || git commit -m "🤖 Update organizations list (auto)"
          git push
