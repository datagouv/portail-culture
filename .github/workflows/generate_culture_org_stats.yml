name: Generate Culture Org Stats

on:
  workflow_dispatch:   # lancement manuel
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run dataset aggregation script
      run: |
        python data/script/OrgaDataCulture.py

    - name: Commit and push results
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        # Ajouter uniquement le fichier CSV
        git add data/organisation_count_culture.csv

        git commit -m "Auto-update culture dataset org stats [skip ci]" || echo "No changes to commit"
        git push
